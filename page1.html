<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./image/heart.png" type="image/png">
    <title>Chúc mừng sinh nhật</title>
    <link href="https://fonts.googleapis.com/css2?family=Gluten:wght@100..900&family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'woff';
            src: url('./font/d.ttf') format('truetype');
        }

        @font-face {
            font-family: 'wof';
            src: url('./font/e.ttf') format('truetype');

        }

        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }

        body {
            background-color: #ffc9c94f;
            display: grid;
            font-family: "Gluten", cursive;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: minmax(auto, auto);
            color: #3e3e3e;
            text-shadow: 0.4px 0.4px 0.4px rgba(0, 0, 0, .3);
        }

        h1 {
            margin: 0;
            padding: 0;
            grid-column: span 3;
            text-align: center;
            color: #ff6d6d;
            margin-top: 10px;
            font-size: 40px;
            font-family: "Gluten", cursive;
            text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.5);
            font-weight: bold;
        }

        #wrapper {
            display: grid;
            grid-column: 3 / 11;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(auto, auto);
            grid-row-gap: 10px;
            margin-top: 1rem;
        }

        #clock-box,
        #info {
            grid-column: span 3;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
        }

        #clock-box #clock {
            grid-column: 4 / 10;
            padding: .6rem 2rem;
            padding-top: .8rem;
            text-align: center;
            font-size: 2.4rem;
            border-radius: 50rem;
        }

        .time-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .time-part {
            background-color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 2.4rem;
            font-family: 'woff';
            margin: 0 0.2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .2);
        }

        .avt {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, .2);
        }

        #heart {
            font-family: 'wof';
            grid-column: span 2;
            display: grid;
            font-size: 24px;
            color: #f87272;
            align-self: center;
            padding-bottom: 1rem;
            text-align: center;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.2);
            }

            50% {
                transform: scale(1);
            }

            75% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        #info {
            font-size: 20px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
        }

        #info .one {
            grid-column: 3 / 6;
            text-align: center;
            font-family: "Gluten", cursive;
            font-size: 22PX;
            font-weight: 800;
        }

        button {
            text-align: center;
            padding: 1rem 2rem;
            font-family: 'wof';
            font-size: 18px;
            background-color: #ec407a;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #ff7979;
        }

        #link-to-album {
            display: block;
            width: 100%;
            text-align: center;
        }

        #link-to-album button {
            display: inline-block;
            margin: 0 auto;
            padding: 1rem 2rem;
            font-size: 18px;
            background-color: #ff8484;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
        }

        #link-to-album button:hover {
            background-color: rgb(255, 159, 159);
        }

        @media (max-width: 768px) {
            body {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 30px;
            }

            #wrapper {
                grid-column: 1 / -1;
                grid-template-columns: 1fr;
            }

            #clock-box {
                margin-top: 1rem;
                grid-column: 1 / -1;
            }

            #heart {
                font-size: 20px;
            }

            .time-container {
                font-size: 2rem;
            }

            .time-part {
                font-size: 1.8rem;
            }

            .avt {
                width: 150px;
                height: 150px;
            }

            button {
                font-size: 16px;
                padding: 0.8rem 1.5rem;
            }

            #link-to-album button {
                padding: 0.8rem 1.5rem;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                margin: 10px;
                font-size: 28px;
            }

            .time-part {
                font-size: 1.5rem;
            }

            #heart {
                font-size: 18px;
            }

            .avt {
                width: 120px;
                height: 120px;
            }

            button {
                font-family: 'wof';
                font-size: 14px;
                padding: 0.6rem 1.2rem;
            }

            #link-to-album button {
                padding: 0.6rem 1.2rem;
                font-size: 14px;
            }

        }
    </style>
</head>
